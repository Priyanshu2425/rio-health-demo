[project]
name = "rio-backend"
version = "0.1.0"
requires-python = ">=3.12"
# Dependencies are part of the contract: every branch shares this file and uv.lock, so
# add a dependency only through a contracts branch. The list below already covers ETL,
# forecasting, parsing and synthetic image generation.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "pillow>=10.4",
    "numpy>=2.0",
    "pandas>=2.2",
    "rapidfuzz>=3.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["db: needs RIO_HEALTH_DATABASE_URL", "llm: calls OpenRouter and costs money"]

[tool.ruff]
line-length = 110
target-version = "py312"
