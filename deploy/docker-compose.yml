# rio-api on the EC2 host. Run from the repo root:
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# Two constraints, both load-bearing:
# - The port binds 127.0.0.1 only, so every request arrives through the Cloudflare
#   Tunnel. That is the only reason the app can trust the CF-Connecting-IP header for
#   its per-IP rate limit. Never publish 8000 on 0.0.0.0.
# - One container, one uvicorn worker (see the Dockerfile CMD). The rate limiter and
#   the startup state (forecast bootstrap) live in process memory. Do not scale.
services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: rio-api
    env_file:
      - /opt/rio/.env
    environment:
      RIO_USE_MOCKS: "0" # production always runs against Neon
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
