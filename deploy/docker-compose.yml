# rio-api on the EC2 host. Run from the repo root:
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# The container listens on 8000; the host port is RIO_HOST_PORT (default 8001, because
# another app on the shared EC2 host already uses 8000).
#
# Two constraints, both load-bearing:
# - The port binds 127.0.0.1 only, so every request arrives through the Cloudflare
#   Tunnel. That is the only reason the app can trust the CF-Connecting-IP header for
#   its per-IP rate limit. Never publish the port on 0.0.0.0.
# - One container, one uvicorn worker (see the Dockerfile CMD). The rate limiter and
#   the startup state (forecast bootstrap) live in process memory. Do not scale.
# A fixed project name keeps compose from touching another app's containers on the
# same host (both compose files live in a directory called deploy/).
name: rio

services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: rio-api
    env_file:
      - /opt/rio/.env
    environment:
      RIO_USE_MOCKS: "0" # production always runs against Neon
    ports:
      - "127.0.0.1:${RIO_HOST_PORT:-8001}:8000"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
