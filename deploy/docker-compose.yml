services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: rio-api
    env_file:
      - /opt/rio/.env
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
